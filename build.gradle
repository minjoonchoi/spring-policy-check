import io.github.minjoonchoi.policy.PolicyCheckTask

plugins {
    id 'base'
    id 'io.github.minjoonchoi.spring-policy'
}
repositories { mavenCentral() }

// This checker repository demonstrates valid Kotlin input with its default task.
tasks.named('policyCheck', PolicyCheckTask) {
    modulePath = ':sample'
    sourceFiles.setFrom(fileTree('samples/valid') { include '**/*.kt' }, fileTree('samples/common') { include '**/*.kt' })
    reportFile = layout.buildDirectory.file('reports/policy/valid.json')
}
['policyWarningCheck': 'warnings', 'policyViolationCheck': 'violations'].each { taskName, sample ->
    tasks.register(taskName, PolicyCheckTask) {
        description = "Check samples/${sample} using the Gradle JVM."
        modulePath = ':sample'
        sourceFiles.from(fileTree("samples/${sample}") { include '**/*.kt' }, fileTree('samples/common') { include '**/*.kt' })
        reportFile = layout.buildDirectory.file("reports/policy/${sample}.json")
    }
}
tasks.register('policyGoodCheck') { group = 'verification'; dependsOn 'policyCheck' }
tasks.register('policySpecTest') {
    group = 'verification'
    description = 'Run Kotlin source specifications, query tests and Gradle TestKit tests.'
    dependsOn gradle.includedBuild('gradle-plugin').task(':test')
}
tasks.named('check') { dependsOn 'policySpecTest' }
tasks.named('assemble') { dependsOn gradle.includedBuild('gradle-plugin').task(':assemble') }
