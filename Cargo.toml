[package]
name = "spring-policy"
version = "0.1.0"
edition = "2021"
description = "Executable policy specification for Kotlin Spring repositories"
license = "MIT"

[dependencies]
tree-sitter = "0.25.10"
tree-sitter-kotlin-ng = "=1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
regex = "1"
rayon = "1"
walkdir = "2"

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "spring-policy"
path = "src/main.rs"
