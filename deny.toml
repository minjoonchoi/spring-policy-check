# Repository baseline. A company policy may narrow this allowlist.
# All other license identifiers are rejected, including unknown licenses.
[graph]
all-features = true

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "Unicode-3.0", "Unicode-DFS-2016", "ICU", "Zlib"]
confidence-threshold = 0.95
include-dev = true
include-build = true
unused-allowed-license = "allow"

[licenses.private]
ignore = false
