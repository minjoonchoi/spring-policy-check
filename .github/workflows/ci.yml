name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Rust format
        run: cargo fmt --all -- --check
      - name: Build native checker
        run: cargo build --release --locked
      - name: Verify rules and Gradle task behavior
        run: python3 scripts/verify-gradle.py
      - name: Package Linux binary
        run: |
          mkdir -p dist
          tar -czf dist/spring-policy-linux-x86_64.tar.gz \
            -C target/release spring-policy \
            -C "$GITHUB_WORKSPACE" LICENSE THIRD_PARTY_NOTICES.md third_party docs/OPEN_SOURCE_POLICY.md
          cd dist
          sha256sum spring-policy-linux-x86_64.tar.gz > SHA256SUMS
      - name: Upload verified binary and reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spring-policy-linux-x86_64
          path: |
            dist/
            build/reports/policy/
          if-no-files-found: error
          retention-days: 30
