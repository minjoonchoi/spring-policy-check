name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Rust format
        run: cargo fmt --all -- --check
      - name: Install pinned license checker
        run: bash .github/install-cargo-deny.sh
      - name: Verify licenses and attribution
        run: python3 scripts/license-check.py
      - name: Test license policy enforcement
        run: python3 -m unittest discover -s tests -p 'test_license_compliance.py' -v
      - name: Build native checker
        run: cargo build --release --locked
      - name: Verify rules and Gradle task behavior
        run: python3 scripts/verify-gradle.py
      - name: Package Linux binary
        run: python3 scripts/package-release.py
      - name: Upload verified binary and reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spring-policy-linux-x86_64
          path: |
            dist/
            build/reports/policy/
          if-no-files-found: error
          retention-days: 30
